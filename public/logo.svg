<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="solGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="50%" stop-color="#4582FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="40%" stop-color="#4582FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#9945FF" flood-opacity="0.3"/>
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Lens circle -->
  <circle cx="200" cy="195" r="120" fill="url(#solGrad)" filter="url(#shadow)" opacity="0.95"/>
  <circle cx="200" cy="195" r="120" fill="none" stroke="url(#solGrad)" stroke-width="8" opacity="0.7"/>
  <circle cx="200" cy="195" r="108" fill="#1a1a2e" opacity="0.85"/>
  <ellipse cx="170" cy="160" rx="55" ry="40" fill="url(#glassReflect)" transform="rotate(-20 170 160)"/>
  <circle cx="200" cy="195" r="105" fill="url(#lensGlow)"/>

  <!-- Solana tri-bar inside lens -->
  <g transform="translate(200, 195)" filter="url(#softShadow)">
    <path d="M-45,-55 L45,-55 L65,-30 L-25,-30 Z" fill="#14F195" opacity="0.9"/>
    <path d="M-65,-10 L15,-10 L35,15 L-45,15 Z" fill="#4582FF" opacity="0.9"/>
    <path d="M-45,25 L65,25 L45,50 L-65,50 Z" fill="#9945FF" opacity="0.9"/>
  </g>

  <!-- Handle -->
  <g filter="url(#softShadow)">
    <line x1="290" y1="290" x2="390" y2="400" stroke="url(#solGrad)" stroke-width="28" stroke-linecap="round"/>
    <line x1="290" y1="290" x2="385" y2="395" stroke="#1a1a2e" stroke-width="14" stroke-linecap="round" opacity="0.3"/>
    <line x1="295" y1="285" x2="375" y2="375" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- Tip coin badge -->
  <g transform="translate(290, 130)" filter="url(#softShadow)">
    <circle r="28" fill="url(#solGrad)"/>
    <circle r="23" fill="#1a1a2e" opacity="0.7"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="url(#solGrad)">◎</text>
    <circle r="30" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Sparkles -->
  <g transform="translate(340, 80)" opacity="0.7">
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#14F195" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#14F195" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(130, 85)" opacity="0.5">
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#9945FF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#9945FF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="256" y="480" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="2" fill="url(#textGrad)" filter="url(#softShadow)">ScoutTip</text>
</svg>
